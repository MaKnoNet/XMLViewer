// Root-Build des Multi-Modul-Projekts.
//   :web-common  -> wiederverwendbare Bibliothek (publizierbares Maven-Artefakt)
//   :demo-app    -> eigenständige Spring-Boot-Demo (NICHT im Artefakt)
// Plugins werden hier nur mit Version deklariert (apply false) und in den Modulen bzw. im
// subprojects-Block angewendet – so liegt die Versionshoheit zentral an einer Stelle.
plugins {
    id 'com.diffplug.spotless' version '6.25.0' apply false
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id 'com.vaadin' version '24.5.3' apply false
}

allprojects {
    group = 'de.makno'
    version = '1.0.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // UTF-8 für Kompilierung/Javadoc erzwingen: die Quellen enthalten Umlaute (ä/ö/ü) in Kommentaren
    // und String-Literalen; ohne diese Festlegung verwendet javac unter Windows Cp1252 und zerstört sie.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.vaadin.com/vaadin-addons' }
    }

    // Code-Formatierung mit palantir-java-format (verbindliche Projekt-Konvention, siehe CLAUDE.md).
    //   ./gradlew spotlessApply   -> formatiert den Java-Code
    //   ./gradlew spotlessCheck   -> prüft das Format (läuft als Teil von `check`/`build`)
    spotless {
        java {
            target 'src/**/*.java'
            palantirJavaFormat()
            removeUnusedImports()
        }
    }
}
