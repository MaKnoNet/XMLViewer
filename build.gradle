// Root-Build des Multi-Modul-Projekts.
//   :web-common  -> wiederverwendbare Bibliothek (publizierbares Maven-Artefakt)
//   :demo-app    -> eigenständige Spring-Boot-Demo (NICHT im Artefakt)
// Die Plugin-Versionen liegen zentral in settings.gradle (pluginManagement); die Vaadin-Version
// kommt dort aus gradle.properties (vaadinVersion) und ist damit eine einzige Quelle für
// Plugin UND vaadin-bom.
plugins {
    id 'com.diffplug.spotless' apply false
    id 'org.springframework.boot' apply false
    id 'com.vaadin' apply false
}

allprojects {
    group = 'de.makno'
    version = '1.0.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // UTF-8 für Kompilierung/Javadoc erzwingen: die Quellen enthalten Umlaute (ä/ö/ü) in Kommentaren
    // und String-Literalen; ohne diese Festlegung verwendet javac unter Windows Cp1252 und zerstört sie.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        // Kein "missing comment"-Rauschen für undokumentierte (v. a. private/interne) Member –
        // alle übrigen doclint-Prüfungen (Syntax, Referenzen, HTML) bleiben aktiv.
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    repositories {
        mavenCentral()
    }

    // JUnit-Platform für alle Module – verhindert, dass ein künftiger JUnit-5-Test vom
    // JUnit-4-Default-Detector still übersprungen wird (Build grün, Test läuft nie).
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
        }
    }

    // Code-Formatierung mit palantir-java-format (verbindliche Projekt-Konvention, siehe CLAUDE.md).
    //   ./gradlew spotlessApply   -> formatiert den Java-Code
    //   ./gradlew spotlessCheck   -> prüft das Format (läuft als Teil von `check`/`build`)
    spotless {
        java {
            target 'src/**/*.java'
            palantirJavaFormat()
            removeUnusedImports()
        }
    }
}

// Aktiviert die versionierten Team-Git-Hooks (.githooks/) fuer dieses Clone.
// Wird beim ersten Build automatisch mitausgefuehrt; manuell: ./gradlew installGitHooks
// Defensiv: ohne .git-Verzeichnis (Quell-Tarball, CI-Checkout ohne Git) passiert nichts.
// Gradle 9 hat Project.exec() zur Ausführungszeit entfernt; externe Prozesse laufen über den
// injizierten ExecOperations-Service. Das Halter-Interface ist der dokumentierte Weg, ihn in einem
// Build-Skript (ohne eigene Task-Klasse) zu beziehen.
interface ExecOpsHolder {
    @javax.inject.Inject
    ExecOperations getExecOps()
}

def execOps = objects.newInstance(ExecOpsHolder).execOps

tasks.register('installGitHooks') {
    description = 'Setzt git config core.hooksPath auf .githooks (Team-Hooks aktivieren)'
    group = 'setup'
    def gitDir = rootProject.file('.git')
    onlyIf { gitDir.exists() }
    doLast {
        execOps.exec { commandLine 'git', 'config', 'core.hooksPath', '.githooks' }
    }
}

subprojects {
    tasks.matching { it.name == 'compileJava' }.configureEach {
        dependsOn rootProject.tasks.named('installGitHooks')
    }
}
