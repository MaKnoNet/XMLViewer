# TLS-Vertrauensanker aus dem Windows-Zertifikatspeicher beziehen.
#
# Hintergrund: In dieser Umgebung terminiert ein TLS-inspizierender Proxy (z. B. Zscaler) die
# HTTPS-Verbindungen mit einem eigenen Root-Zertifikat. Dieses liegt im Windows-Zertifikatspeicher
# (deshalb funktionieren Browser/PowerShell), aber NICHT im JDK-eigenen "cacerts". Ohne die folgende
# Einstellung scheitert jeder Gradle-Download an:
#   javax.net.ssl.SSLHandshakeException: PKIX path building failed (unable to find valid cert path)
#
# Mit "Windows-ROOT" nutzt die JVM den Windows-Truststore und vertraut dem Proxy-Zertifikat.
# Hinweis: Diese Property ist Windows-spezifisch und gehört daher nicht zwingend ins Repository –
# bei Bedarf in die ignorierte gradle.properties des Gradle-Home (~/.gradle) verschieben.
org.gradle.jvmargs=-Djavax.net.ssl.trustStoreType=Windows-ROOT -Dfile.encoding=UTF-8
