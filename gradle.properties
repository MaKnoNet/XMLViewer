# Build-Encoding deterministisch halten (auf Java 21+ ohnehin UTF-8-Default, hier nur explizit, damit
# Umlaute in Quellen/Kommentaren auch unter abweichenden Plattform-Defaults korrekt verarbeitet werden).
org.gradle.jvmargs=-Dfile.encoding=UTF-8

# Zentral gepflegte Vaadin-Version – einzige Quelle für das Vaadin-Gradle-Plugin
# (settings.gradle/pluginManagement) UND die vaadin-bom beider Module.
#
# Vaadin 25 setzt Java 21+, Spring Boot 4 / Spring Framework 7, Servlet 6.1 (Jakarta EE 11),
# Gradle 8.14+ und Node 24+ voraus (Node bringt das Vaadin-Plugin selbst mit).
#
# Diese Version ist zugleich die LAUFZEIT-UNTERGRENZE des publizierten Artefakts: die
# executeJs-Überladungen unterscheiden sich zwischen 24 und 25, deshalb legt die Compile-Version
# fest, ab welcher Vaadin-Generation die Bibliothek läuft. Siehe
# docs/okf/xmlviewer/conventions/vaadin-api-nutzung.md.
vaadinVersion=25.2.5

# JUnit-Version für die Bibliothekstests (web-common ist bewusst Spring-frei und kann die
# Versionen nicht aus der Spring-Boot-BOM beziehen).
junitVersion=5.10.5

# --- TLS hinter einem TLS-inspizierenden Proxy (z. B. Zscaler) ---
#
# Ein solcher Proxy terminiert HTTPS mit einer eigenen Root-CA, die NICHT im JDK-"cacerts" liegt.
# Ohne Vertrauen scheitern Gradle-/Vaadin-Downloads mit:
#   javax.net.ssl.SSLHandshakeException: PKIX path building failed (unable to find valid cert path)
#
# Das nötige Vertrauen ist MASCHINEN-/OS-SPEZIFISCH und steht daher bewusst NICHT hier (sonst bricht
# der Build auf anderen Plattformen – z. B. ist der Truststore-Typ "Windows-ROOT" nur unter Windows
# verfügbar). Pro Maschine in ~/.gradle/gradle.properties (GRADLE_USER_HOME) setzen; diese Datei
# überschreibt die Projektdatei:
#
#   Windows:  org.gradle.jvmargs=-Djavax.net.ssl.trustStoreType=Windows-ROOT -Dfile.encoding=UTF-8
#             (die JVM nutzt den Windows-Zertifikatspeicher und vertraut der Proxy-CA)
#
#   Linux:    Proxy-Root-CA systemweit installieren – danach vertraut das JDK ihr automatisch und es
#             ist KEINE jvmargs-Anpassung nötig:
#               # Debian/Ubuntu:
#               sudo cp proxy-root.crt /usr/local/share/ca-certificates/proxy-root.crt
#               sudo apt-get install -y ca-certificates-java   # integriert System-CAs ins JDK-cacerts
#               sudo update-ca-certificates
#               # RHEL/Fedora:
#               sudo cp proxy-root.crt /etc/pki/ca-trust/source/anchors/proxy-root.crt
#               sudo update-ca-trust
#             Alternativ den Truststore explizit setzen, z. B.:
#               org.gradle.jvmargs=-Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts -Dfile.encoding=UTF-8
