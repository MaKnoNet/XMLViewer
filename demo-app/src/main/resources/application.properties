# Server-Port der Demo-App
server.port=8080

# Vaadin: Package-PRÄFIX für das Routen-/Komponenten-Scanning (Subpackages eingeschlossen).
# de.makno deckt Bibliothek UND App ab – neue Bibliotheks-Packages brauchen keine Anpassung.
vaadin.allowed-packages=de.makno

# Etwas ruhigeres Log beim Start
logging.level.org.atmosphere=warn
