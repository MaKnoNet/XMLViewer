// Wiederverwendbare Web-Komponenten-Bibliothek (Vaadin-Add-on).
// Publiziert als de.makno:web-common:<version> (group/version stammen aus dem Root via allprojects).
// KEIN Spring, KEIN Vaadin-Gradle-Plugin: das Add-on liefert nur Klassen + Frontend-Ressourcen im
// Jar (META-INF/resources/frontend/...); das Frontend-Bundling übernimmt das konsumierende App-Modul.
plugins {
    id 'java-library'
    id 'maven-publish'
    // Test-Coverage (JaCoCo): Report unter build/reports/jacoco/test/html/index.html
    id 'jacoco'
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // Die öffentliche API der Komponenten exponiert Vaadin- (Composite, Registration,
    // ComponentEvent, ...) und JDOM2-Typen (org.jdom2.Element) -> 'api', damit Konsumenten sie
    // transitiv sehen. Bewusst NUR die tatsächlich genutzten Flow-Module statt des
    // vaadin-core-Sammelartefakts (~45 Module: Grid, Login, Upload, Themes, ...) – das hält den
    // Compile-Classpath der Konsumenten schlank. Alle Versionen kommen aus der vaadin-bom.
    api platform("com.vaadin:vaadin-bom:${vaadinVersion}")
    api 'com.vaadin:flow-server' // Component/Composite/Events/@CssImport/@JsModule, elemental.json
    api 'com.vaadin:flow-html-components' // Div, Span
    api 'com.vaadin:flow-data' // ValueChangeMode
    api 'com.vaadin:vaadin-button-flow'
    api 'com.vaadin:vaadin-text-field-flow'
    api 'com.vaadin:vaadin-icons-flow' // VaadinIcon + Icon
    api 'com.vaadin:vaadin-ordered-layout-flow'
    api 'org.jdom:jdom2:2.0.6.1'

    // JUnit-Version zentral aus gradle.properties (junitVersion) – web-common ist Spring-frei
    // und hat keine Spring-Boot-BOM, die das übernehmen könnte.
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// useJUnitPlatform/testLogging kommen zentral aus dem Root-Build (subprojects).
test {
    // Coverage-Report nach jedem Testlauf automatisch erzeugen.
    finalizedBy jacocoTestReport
}

// JaCoCo-Version und HTML-Report sind Gradle-Defaults; nur der XML-Report (für CI-Tooling)
// ist eine bewusste Abweichung.
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            // components.java enthält bei withSourcesJar()/withJavadocJar() auch die
            // -sources- und -javadoc-Jars.
            from components.java
        }
    }
}
